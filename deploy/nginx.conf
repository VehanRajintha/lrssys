# ==============================================================================
# LRSYS - Sri Lanka Customs (CusDec) Extraction Terminal
# Production Nginx Reverse Proxy Configuration
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name (e.g. cusdec.yourdomain.com) if available

    # Maximum upload file size for large ZIP batches and high-resolution CusDec images
    client_max_body_size 250M;

    # Gzip Compression for fast page loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Next.js Static Cache Optimization
    location /_next/static/ {
        proxy_pass http://127.0.0.1:5000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main Application & API Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket & Real-time Stream Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time progress bars and chunked streams
        proxy_buffering off;
        proxy_cache off;

        # Generous Timeouts for AI Extraction & Batch Processing
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
